project:
  type: website
  output-dir: docs

website:
  title: "Forest Health Laboratory"
  description: "Lab website for Matthew Ginzel"
  image: img/purdue-logo.png
  favicon: img/purdue-logo.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: img/lab_logo/lab_logo.png
    
    # your sub-pages
    right:
      - text: "Research"
        href: research/research.qmd
      - text: "Lab Members"
        href: lab_members/lab_members.qmd
      - text: "Courses"
        href: courses/courses.qmd
      - text: "Publications"
        href: publications/publications.qmd
      - text: "Links"
        href: links/links.qmd

      
    
    # your social media handles
    left:
      - icon: google
        href: https://scholar.google.com/citations?hl=en&user=il2dzT0AAAAJ
      - icon: envelope
        aria-label: email
        href: "mailto:mginzel@purdue.edu"
        
  # person-workspace
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    center: |

      <div style="text-align: center;">
      <div style="display: flex; justify-content: center; align-items: center; gap: 150px; flex-wrap: wrap; margin-bottom: 12px;">
        <a href="https://www.purdue.edu" target="_blank" rel="noopener noreferrer">
          <img src="/img/PU-H-Full-RGB.png" alt="Purdue University" style="height: 30px; width: auto;">
        </a>
        <a href="https://htirc.org/" target="_blank" rel="noopener noreferrer">
          <img src="/img/HTIRC.png" alt="HTIRC" style="height: 35px; width: auto;">
        </a>
      </div>

      <div style="display: flex; justify-content: center; align-items: center; gap: 40px; flex-wrap: wrap; margin-bottom: 12px;">
        <a href="https://ag.purdue.edu/" target="_blank" rel="noopener noreferrer">Purdue Agriculture</a> •
        <a href="https://www.purdue.edu" target="_blank" rel="noopener noreferrer">Entomology</a> •
        <a href="https://ag.purdue.edu/department/fnr/" target="_blank" rel="noopener noreferrer">Forestry and Natural Resources</a> •
      </div>

      <span class="faux-block">
        © Copyright <span id="year"></span> | Forest Health Laboratory
      </span>
      </div>
  
      <script>
        document.getElementById("year").textContent = new Date().getFullYear();
      </script>
   
format:
  html:
    fontsize: 1.1em
    theme: 
      light: style2.scss
      dark:  style2-dark.scss

      
      # - style2-dark.scss
    toc: true
    toc-depth: 4
    toc-title: ""
    footnotes-hover: true
    highlight-style: tango